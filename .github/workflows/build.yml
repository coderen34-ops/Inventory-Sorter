name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build (log'u dosyaya da yaz)
        run: mvn -B package > build.log 2>&1 || true
      - name: Build log'u her zaman push et (basarili/basarisiz)
        if: always()
        run: |
          cp build.log /tmp/build.log
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan buildlog
          git rm -rf . -q 2>/dev/null || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin buildlog
          git checkout main
      - name: Jar olustu mu kontrol et
        run: ls target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-sorter
          path: target/*.jar
      - name: Jar'i jar dalina koy
        run: |
          mkdir -p /tmp/out && cp target/*.jar /tmp/out/
          git checkout --orphan jar
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add -A
          git commit -q -m "derlenmis jar"
          git push -f origin jar
